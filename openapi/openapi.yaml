openapi: 3.1.1
info:
  title: Verified DeepSeek pricing schedule API
  version: 1.0.0
  license:
    name: UNLICENSED
    identifier: NOASSERTION
  description: |
    A public, read-only schedule and model-rate snapshot verified from DeepSeek's published pricing page.
    Price values are decimal strings in USD per 1M tokens. Peak windows are UTC start-inclusive, end-exclusive intervals.
servers:
  - url: /
security: []
paths:
  /v1/pricing-schedule:
    get:
      operationId: getPricingSchedule
      summary: Get the verified pricing schedule
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: A verified schedule snapshot.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Date:
              $ref: '#/components/headers/Date'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSchedule'
        '304':
          description: The ETag matched the current representation. This response has no body.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Date:
              $ref: '#/components/headers/Date'
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: A previously received ETag. A matching value returns a bodyless 304 response.
      schema:
        type: string
  headers:
    CacheControl:
      required: true
      schema:
        type: string
        const: public, max-age=86400, must-revalidate
    Date:
      required: true
      schema:
        type: string
        description: HTTP-date for the response.
    ETag:
      required: true
      schema:
        type: string
        pattern: '^"[a-f0-9]{64}"$'
  responses:
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: The resource supports GET only.
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: GET
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The request exceeds the per-location rate limit.
      headers:
        Retry-After:
          required: true
          schema:
            type: string
            const: '60'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: The service could not read its verified snapshot.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: A verified schedule has not been stored yet.
      headers:
        Retry-After:
          required: true
          schema:
            type: string
            const: '3600'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PricingSchedule:
      type: object
      additionalProperties: false
      required: [rateUnit, schedule, models, provenance, freshness]
      properties:
        rateUnit:
          $ref: '#/components/schemas/RateUnit'
        schedule:
          $ref: '#/components/schemas/Schedule'
        models:
          type: object
          minProperties: 1
          propertyNames:
            pattern: '^[a-z0-9][a-z0-9._-]*$'
          additionalProperties:
            $ref: '#/components/schemas/ModelRates'
        provenance:
          $ref: '#/components/schemas/Provenance'
        freshness:
          $ref: '#/components/schemas/Freshness'
    RateUnit:
      type: object
      additionalProperties: false
      required: [currency, perTokens]
      properties:
        currency:
          type: string
          const: USD
        perTokens:
          type: integer
          const: 1000000
    ModelRates:
      type: object
      additionalProperties: false
      required: [offPeak, peak]
      properties:
        offPeak:
          $ref: '#/components/schemas/TokenRates'
        peak:
          $ref: '#/components/schemas/TokenRates'
    TokenRates:
      type: object
      additionalProperties: false
      required: [inputCacheHit, inputCacheMiss, output]
      properties:
        inputCacheHit:
          $ref: '#/components/schemas/Price'
        inputCacheMiss:
          $ref: '#/components/schemas/Price'
        output:
          $ref: '#/components/schemas/Price'
    Price:
      type: string
      pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
      description: A non-negative decimal string in USD per 1M tokens.
    Schedule:
      type: object
      additionalProperties: false
      required:
        - timeZone
        - peakWeekdays
        - peakWindows
        - holidayTimeZone
        - holidayCoverage
        - holidays
      properties:
        timeZone:
          type: string
          const: UTC
        peakWeekdays:
          type: array
          minItems: 1
          items:
            type: string
            enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
        peakWindows:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PeakWindow'
        holidayTimeZone:
          type: string
          const: Asia/Shanghai
        holidayCoverage:
          $ref: '#/components/schemas/HolidayCoverage'
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/CalendarDate'
    PeakWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
    HolidayCoverage:
      type: object
      additionalProperties: false
      required: [startsOn, endsOn]
      properties:
        startsOn:
          $ref: '#/components/schemas/CalendarDate'
        endsOn:
          $ref: '#/components/schemas/CalendarDate'
    CalendarDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
    Provenance:
      type: object
      additionalProperties: false
      required: [pricing, holidays]
      properties:
        pricing:
          $ref: '#/components/schemas/Source'
        holidays:
          allOf:
            - $ref: '#/components/schemas/Source'
            - type: object
              additionalProperties: false
              required: [noticeURL]
              properties:
                noticeURL:
                  type: string
                  format: uri
    Source:
      type: object
      additionalProperties: false
      required: [url, contentSha256, retrievedAt]
      properties:
        url:
          type: string
          format: uri
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        retrievedAt:
          type: string
          format: date-time
    Freshness:
      type: object
      additionalProperties: false
      required: [status, checkedAt, verifiedAt]
      properties:
        status:
          type: string
          enum: [CURRENT, STALE]
        checkedAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
